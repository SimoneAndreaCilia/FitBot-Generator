name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: black (formatting)
        run: black --check src/ tests/

      - name: isort (import order)
        run: isort --check-only src/ tests/

      - name: flake8 (style)
        run: flake8 src/ tests/

      - name: pylint (analysis)
        run: pylint src/wod/

      - name: mypy (types)
        run: mypy src/wod/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          TELEGRAM_BOT_TOKEN: "test-token-not-real"
          DATABASE_URL: "sqlite+aiosqlite:///test.db"
        run: pytest --cov=src/wod --cov-report=term-missing --cov-fail-under=75
